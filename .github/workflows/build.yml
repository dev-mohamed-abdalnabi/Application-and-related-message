name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arrange project structure
        run: python3 assemble.py

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Tajawal font
        run: |
          set -e
          mkdir -p app/src/main/res/font
          BASE="https://github.com/google/fonts/raw/main/ofl/tajawal"
          for pair in Regular:regular Medium:medium Bold:bold ExtraBold:extrabold; do
            curl -fL --retry 5 --retry-delay 3 -o "app/src/main/res/font/tajawal_${pair#*:}.ttf" "$BASE/Tajawal-${pair%%:*}.ttf"
          done
          ls -la app/src/main/res/font

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Phone.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Phone build ${{ github.run_number }}
          files: dist/Phone.apk
          make_latest: true
